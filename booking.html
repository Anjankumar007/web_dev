<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL 2026 - Book Tickets</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <header>
        <nav>
            <a href="index.html#schedule">Matches</a>
            <a href="booking.html">Book Ticket</a>
            <a href="index.html#my-bookings">My Bookings</a>
            <a href="index.html#guidelines">Guidelines</a>
        </nav>
    </header>

    <div class="container">
        <section>
            <h2>IPL 2026 Ticket Booking Form</h2>
            <p>Please fill in the details below to book your match tickets. All fields marked with * are required.</p>
            <br>

            <!-- Ticket Booking Form -->
            <form action="#" method="post">
                
                <!-- Full Name Field -->
                <p>
                    <label for="fullname">Full Name *</label>
                    <input 
                        type="text" 
                        id="fullname" 
                        name="fullname" 
                        placeholder="Enter your full name" 
                        required 
                        minlength="3" 
                        maxlength="50"
                    >
                </p>

                <!-- Email Field -->
                <p>
                    <label for="email">Email Address *</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="example@domain.com" 
                        required
                    >
                </p>

                <!-- Phone Number Field -->
                <p>
                    <label for="phone">Phone Number *</label>
                    <input 
                        type="tel" 
                        id="phone" 
                        name="phone" 
                        placeholder="10-digit phone number" 
                        required 
                        pattern="[0-9]{10}"
                        minlength="10"
                        maxlength="10"
                        title="Please enter a valid 10-digit phone number"
                    >
                </p>

                <!-- Match Selection Dropdown -->
                <p>
                    <label for="match">Select Match *</label>
                    <select id="match" name="match" required>
                        <option value="">-- Choose Match --</option>
                        <option value="match01">Match 01: CSK vs MI (March 28, Chennai)</option>
                        <option value="match02">Match 02: RCB vs KKR (March 29, Bengaluru)</option>
                        <option value="match03">Match 03: MI vs GT (March 31, Mumbai)</option>
                    </select>
                </p>

                <!-- Stand Category Dropdown -->
                <p>
                    <label for="stand">Stand Category *</label>
                    <select id="stand" name="stand" required>
                        <option value="">-- Select Stand --</option>
                        <option value="general">General Stand (₹1,500)</option>
                        <option value="premium">Premium Stand (₹3,500)</option>
                        <option value="vip">VIP Hospitality (₹8,000)</option>
                    </select>
                </p>

                <!-- Number of Tickets Field -->
                <p>
                    <label for="tickets">Number of Tickets (1 to 6) *</label>
                    <input 
                        type="number" 
                        id="tickets" 
                        name="tickets" 
                        value="1" 
                        min="1" 
                        max="6" 
                        required
                    >
                </p>

                <!-- Radio Buttons: Additional Preference (Delivery Method) -->
                <p>
                    <label>Ticket Delivery Preference *</label><br>
                    <input type="radio" id="e-ticket" name="delivery" value="digital" checked required style="width: auto;">
                    <label for="e-ticket" style="display: inline; font-weight: normal;"> E-Ticket (Email/SMS)</label>
                    &nbsp;&nbsp;
                    <input type="radio" id="physical" name="delivery" value="courier" style="width: auto;">
                    <label for="physical" style="display: inline; font-weight: normal;"> Physical Ticket (Courier)</label>
                </p>
                <br>

                <!-- Checkbox: Terms Agreement -->
                <p>
                    <input type="checkbox" id="terms" name="terms" required style="width: auto;">
                    <label for="terms" style="display: inline; font-weight: normal;"> I agree to the stadium rules and guidelines *</label>
                </p>
                <br>

                <!-- Buttons -->
                <button type="submit" class="btn">Submit Booking</button>
                <button type="reset" class="btn" style="background-color: #666;">Reset Form</button>

            </form>
        </section>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 IPL Ticket Booking Portal. All Rights Reserved.</p>
    </footer>

</body>
</html>
